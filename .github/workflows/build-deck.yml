name: Build deck

# Rebuilds data/deck.json (photos, silhouettes, look-alike answers) whenever the species list changes.
# You can also run it by hand: Actions tab > Build deck > Run workflow (tick "refresh" to re-pick every photo).
on:
  push:
    paths:
      - 'data/species.json'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Rebuild every species from scratch (re-picks all photos)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-deck
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the deck
        run: node scripts/build-deck.mjs ${{ inputs.refresh && '--refresh' || '' }}
      - name: Check the deck
        run: node scripts/check.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update species deck"
            git push
          fi
