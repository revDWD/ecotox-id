# Pages CMS configuration: sign in at https://app.pagescms.org with GitHub and open this repository.
# Add or remove species here; the "Build deck" Action then fetches photos, silhouettes and look-alike
# answers automatically and the site updates a few minutes later.

content:
  - name: species
    label: Species list
    type: file
    path: data/species.json
    format: json
    fields:
      - name: species
        label: Species
        type: object
        list: true
        fields:
          - name: name
            label: Scientific name
            type: string
            required: true
            description: Exactly as on iNaturalist, e.g. Helicoverpa zea. Species only (two words), no common names.
          - name: role
            label: Role
            type: select
            required: true
            options:
              values:
                - { value: pest, label: Crop pest }
                - { value: enemy, label: Natural enemy }
                - { value: pollinator, label: Pollinator }
                - { value: test, label: Test and indicator species }
          - name: regions
            label: Geographic regions
            type: select
            list: true
            required: true
            description: Broad approximate regions, not verified range maps.
            options:
              values:
                - { value: North America, label: North America }
                - { value: Central America, label: Central America }
                - { value: South America, label: South America }
                - { value: Europe, label: Europe }
                - { value: Africa, label: Africa }
                - { value: Asia, label: Asia }
                - { value: Oceania, label: Oceania }
          - name: notes
            label: Ecotox notes (one line each)
            type: string
            list: true
            description: Short one-line notes. One is shown at random after each answer, and all appear in the Field guide.
          - name: rare
            label: Rare surprise encounter
            type: boolean
            description: Tick for a rare easter egg. It stays out of the normal rotation and shows up in about 1 of 25 battles.
          - name: legendary
            label: Legendary encounter (also stays in the normal deck)
            type: boolean
            description: Tick for a golden legendary encounter that shows up in about 1 of 65 battles. The species stays in the normal rotation too.
          - name: intro
            label: Rare/legendary intro line
            type: string
            description: Optional line shown when a rare organism appears, e.g. A RARE fire-breather appeared!
