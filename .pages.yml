# Pages CMS configuration: sign in at https://app.pagescms.org with GitHub and open this repository.
# Add or remove species here; the "Build deck" Action then fetches photos, silhouettes and look-alike
# answers automatically and the site updates a few minutes later.

content:
  - name: species
    label: Species list
    type: file
    path: data/species.json
    format: json
    fields:
      - name: species
        label: Species
        type: object
        list: true
        fields:
          - name: name
            label: Scientific name
            type: string
            required: true
            description: Exactly as on iNaturalist, e.g. Helicoverpa zea. Species only (two words), no common names.
          - name: role
            label: Role
            type: select
            required: true
            options:
              values:
                - { value: pest, label: Crop pest }
                - { value: enemy, label: Natural enemy }
                - { value: pollinator, label: Pollinator }
                - { value: test, label: Test and indicator species }
          - name: notes
            label: Ecotox notes (one line each)
            type: string
            list: true
            description: Short one-line notes. One is shown at random after each answer, and all appear in the Field guide.
